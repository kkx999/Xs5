name: Prepare Xs5 v1.2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v1.2.1.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply v1.2.1 fix
        run: python3 .github/scripts/prepare-v1.2.1.py
      - name: Format and test
        run: |
          gofmt -w main.go telegram.go proxyscrape.go proxyscrape_test.go
          go test ./...
          go vet ./...
      - name: Metadata-only ProxyScrape smoke test
        run: |
          cat > proxyscrape_feed_smoke_test.go <<'EOF'
          package main
          import "testing"
          func TestProxyScrapeFeedSmoke(t *testing.T) {
            nodes, err := fetchProxyScrapeNodes()
            if err != nil { t.Fatal(err) }
            if len(nodes) == 0 { t.Fatal("ProxyScrape returned zero candidates after adaptive filtering") }
            t.Logf("ProxyScrape adaptive metadata filter kept %d candidates", len(nodes))
          }
          EOF
          gofmt -w proxyscrape_feed_smoke_test.go
          go test -run TestProxyScrapeFeedSmoke -count=1 -v
          rm -f proxyscrape_feed_smoke_test.go
      - name: Policy guards
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "1.2.1"
          grep -q 'appVersion       = "v1.2.1"' main.go
          grep -q 'proxyScrapePreferredUptimePct = 60.0' proxyscrape.go
          grep -q 'proxyScrapeFallbackUptimePct  = 40.0' proxyscrape.go
          grep -q 'proxyScrapeFloorUptimePct     = 25.0' proxyscrape.go
          grep -q 'refreshAllSourcesText' telegram.go
          grep -q 'ProxyScrape' telegram.go
          ! grep -q 'Xs5 v1.2.1' README.md
      - name: Remove temporary preparation files
        run: |
          rm -f .github/scripts/prepare-v1.2.1.py
          rm -f .github/workflows/prepare-v1.2.1.yml
          rmdir .github/scripts 2>/dev/null || true
      - name: Commit v1.2.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: release Xs5 v1.2.1 adaptive ProxyScrape filtering'
          git push
