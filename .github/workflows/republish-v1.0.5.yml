name: Rebuild final Xs5 v1.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/republish-v1.0.5.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Remove temporary workflow from final source
        id: final
        run: |
          set -euo pipefail
          rm -f .github/workflows/republish-v1.0.5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize v1.0.5 release source'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test final source
        run: |
          go test ./...
          go vet ./...
      - name: Build final packages
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$VERSION" = "1.0.5"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -ldflags '-s -w' -o xs5d .
            PKG="xs5-v${VERSION}-linux-${ARCH}"
            mkdir -p "dist/$PKG"
            cp xs5d install.sh uninstall.sh xs5.sh xs5.service README.md LICENSE "dist/$PKG/"
            (cd "dist/$PKG" && tar -czf "../${PKG}.tar.gz" .)
            rm -rf "dist/$PKG" xs5d
          done
          (cd dist && sha256sum xs5-v${VERSION}-linux-*.tar.gz > SHA256SUMS)
      - name: Replace v1.0.5 release with final build
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        run: |
          set -euo pipefail
          gh release delete v1.0.5 --yes --cleanup-tag || true
          git push origin :refs/tags/v1.0.5 >/dev/null 2>&1 || true
          gh release create v1.0.5 \
            dist/xs5-v1.0.5-linux-amd64.tar.gz \
            dist/xs5-v1.0.5-linux-arm64.tar.gz \
            dist/SHA256SUMS \
            --target "$FINAL_SHA" \
            --title "Xs5 v1.0.5" \
            --notes-file RELEASE.md
