name: Prepare Xs5 v1.1.0

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v1_1_0.py'
      - 'scripts/fix_flag_v1_1_0.py'
      - '.github/workflows/prepare-v1.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply v1.1.0 integration
        run: |
          python3 scripts/apply_v1_1_0.py
          python3 scripts/fix_flag_v1_1_0.py
      - name: Format and test
        run: |
          gofmt -w *.go
          go test ./...
          go vet ./...
      - name: Remove temporary preparation files
        run: |
          rm -f scripts/apply_v1_1_0.py scripts/fix_flag_v1_1_0.py
          rm -f .github/workflows/prepare-v1.1.0.yml
          rmdir scripts 2>/dev/null || true
      - name: Commit v1.1.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: release Xs5 v1.1.0 Telegram control'
          git push
