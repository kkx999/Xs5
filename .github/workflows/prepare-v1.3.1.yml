name: Prepare Xs5 v1.3.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v1.3.1.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply Telegram latest-failure retention
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('telegram.go')
          s = p.read_text()

          def rep(old, new, count=1):
              global s
              if s.count(old) < count:
                  raise SystemExit('missing expected snippet: ' + old[:120])
              s = s.replace(old, new, count)

          rep('''\tPausedPools    map[string]bool `json:"paused_pools,omitempty"`\n}''', '''\tPausedPools     map[string]bool  `json:"paused_pools,omitempty"`\n\tFailureMessages map[string]int64 `json:"failure_messages,omitempty"`\n}''')

          rep('''\t\tNotifyRecovery: true, NotifyResource: true, NotifyRefresh: true,\n\t\tPausedPools: map[string]bool{},\n''', '''\t\tNotifyRecovery: true, NotifyResource: true, NotifyRefresh: true,\n\t\tPausedPools: map[string]bool{}, FailureMessages: map[string]int64{},\n''')

          rep('''\tif cfg.PausedPools == nil {\n\t\tcfg.PausedPools = map[string]bool{}\n\t}\n''', '''\tif cfg.PausedPools == nil {\n\t\tcfg.PausedPools = map[string]bool{}\n\t}\n\tif cfg.FailureMessages == nil {\n\t\tcfg.FailureMessages = map[string]int64{}\n\t}\n''', 1)

          rep('''\tif t.cfg.PausedPools == nil {\n\t\tt.cfg.PausedPools = map[string]bool{}\n\t}\n\tif err := os.MkdirAll''', '''\tif t.cfg.PausedPools == nil {\n\t\tt.cfg.PausedPools = map[string]bool{}\n\t}\n\tif t.cfg.FailureMessages == nil {\n\t\tt.cfg.FailureMessages = map[string]int64{}\n\t}\n\tif err := os.MkdirAll''', 1)

          old_send = '''func (t *TelegramManager) sendTo(token string, chatID int64, text string, markup any) {\n\tif chatID == 0 || strings.TrimSpace(token) == "" {\n\t\treturn\n\t}\n\tpayload := map[string]any{"chat_id": chatID, "text": safeTGText(text, 3900), "disable_web_page_preview": true}\n\tif markup != nil {\n\t\tpayload["reply_markup"] = markup\n\t}\n\tctx, cancel := context.WithTimeout(context.Background(), 12*time.Second)\n\tdefer cancel()\n\t_ = telegramCall(ctx, token, "sendMessage", payload, nil)\n}\n'''
          new_send = '''func (t *TelegramManager) sendToMessageID(token string, chatID int64, text string, markup any) (int64, error) {\n\tif chatID == 0 || strings.TrimSpace(token) == "" {\n\t\treturn 0, errors.New("Telegram 未绑定")\n\t}\n\tpayload := map[string]any{"chat_id": chatID, "text": safeTGText(text, 3900), "disable_web_page_preview": true}\n\tif markup != nil {\n\t\tpayload["reply_markup"] = markup\n\t}\n\tctx, cancel := context.WithTimeout(context.Background(), 12*time.Second)\n\tdefer cancel()\n\tvar sent struct {\n\t\tMessageID int64 `json:"message_id"`\n\t}\n\tif err := telegramCall(ctx, token, "sendMessage", payload, &sent); err != nil {\n\t\treturn 0, err\n\t}\n\treturn sent.MessageID, nil\n}\n\nfunc (t *TelegramManager) sendTo(token string, chatID int64, text string, markup any) {\n\t_, _ = t.sendToMessageID(token, chatID, text, markup)\n}\n'''
          rep(old_send, new_send)

          marker = '''func safeTGText(s string, max int) string {'''
          helper = r'''func failureMessageKey(poolID string) string {
	return "switch-fail:" + poolID
}

func (t *TelegramManager) deleteMessage(token string, chatID, messageID int64) bool {
	if strings.TrimSpace(token) == "" || chatID == 0 || messageID == 0 {
		return false
	}
	ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
	defer cancel()
	return telegramCall(ctx, token, "deleteMessage", map[string]any{
		"chat_id": chatID, "message_id": messageID,
	}, nil) == nil
}

// replaceFailureMessage sends the new failure first, then removes the previous
// message for the same pool. This avoids losing the last known failure if a new
// Telegram send itself fails.
func (t *TelegramManager) replaceFailureMessage(poolID, text string) {
	key := failureMessageKey(poolID)
	t.mu.RLock()
	token, chatID := t.cfg.Token, t.cfg.ChatID
	enabled := t.cfg.Enabled
	t.mu.RUnlock()
	if !enabled || token == "" || chatID == 0 {
		return
	}
	newID, err := t.sendToMessageID(token, chatID, text, nil)
	if err != nil || newID == 0 {
		return
	}

	t.mu.Lock()
	if t.cfg.FailureMessages == nil {
		t.cfg.FailureMessages = map[string]int64{}
	}
	oldID := t.cfg.FailureMessages[key]
	t.cfg.FailureMessages[key] = newID
	_ = t.saveLocked()
	t.mu.Unlock()

	if oldID != 0 && oldID != newID {
		_ = t.deleteMessage(token, chatID, oldID)
	}
}

// clearFailureMessage removes the retained failure notification after this pool
// has recovered. If Telegram temporarily refuses deletion, keep the ID so a
// later recovery can retry instead of forgetting the stale message.
func (t *TelegramManager) clearFailureMessage(poolID string) {
	key := failureMessageKey(poolID)
	t.mu.RLock()
	token, chatID := t.cfg.Token, t.cfg.ChatID
	messageID := t.cfg.FailureMessages[key]
	t.mu.RUnlock()
	if messageID == 0 {
		return
	}
	if !t.deleteMessage(token, chatID, messageID) {
		return
	}
	t.mu.Lock()
	if t.cfg.FailureMessages[key] == messageID {
		delete(t.cfg.FailureMessages, key)
		_ = t.saveLocked()
	}
	t.mu.Unlock()
}

'''
          if marker not in s:
              raise SystemExit('safeTGText marker missing')
          s = s.replace(marker, helper + marker, 1)

          rep('''func (t *TelegramManager) notifySwitchSuccess(p *Pool, before PoolView, phase string) {\n\tif t == nil || p == nil || phase == "restoring" {\n\t\treturn\n\t}\n''', '''func (t *TelegramManager) notifySwitchSuccess(p *Pool, before PoolView, phase string) {\n\tif t == nil || p == nil {\n\t\treturn\n\t}\n\tif phase == "restoring" {\n\t\tif p.view().Status == "up" {\n\t\t\tt.clearFailureMessage(p.ID)\n\t\t}\n\t\treturn\n\t}\n''')

          rep('''\tafter := p.view()\n\tif after.Status != "up" {\n\t\treturn\n\t}\n''', '''\tafter := p.view()\n\tif after.Status != "up" {\n\t\treturn\n\t}\n\tt.clearFailureMessage(p.ID)\n''', 1)

          rep('''\tt.sendBound("❌ "+poolDisplay(v)+" 暂未找到可用出口\\n\\n"+safeTGText(v.Error, 1200), nil)\n}''', '''\tt.replaceFailureMessage(p.ID, "❌ "+poolDisplay(v)+" 暂未找到可用出口\\n\\n"+safeTGText(v.Error, 1200))\n}''', 1)

          rep('''\tif tokenChanged {\n\t\tt.cfg.UserID = 0\n\t\tt.cfg.ChatID = 0\n\t\tt.cfg.BoundAt = time.Time{}\n\t\tt.bindingUntil = time.Time{}\n\t}\n''', '''\tif tokenChanged {\n\t\tt.cfg.UserID = 0\n\t\tt.cfg.ChatID = 0\n\t\tt.cfg.BoundAt = time.Time{}\n\t\tt.cfg.FailureMessages = map[string]int64{}\n\t\tt.bindingUntil = time.Time{}\n\t}\n''', 1)

          rep('''\tif formBool(r, "reset") {\n\t\tt.cfg.UserID = 0\n\t\tt.cfg.ChatID = 0\n\t\tt.cfg.BoundAt = time.Time{}\n\t}\n''', '''\tif formBool(r, "reset") {\n\t\tt.cfg.UserID = 0\n\t\tt.cfg.ChatID = 0\n\t\tt.cfg.BoundAt = time.Time{}\n\t\tt.cfg.FailureMessages = map[string]int64{}\n\t}\n''', 1)

          rep('''\tt.cfg.UserID = 0\n\tt.cfg.ChatID = 0\n\tt.cfg.BoundAt = time.Time{}\n\tt.bindingUntil = time.Time{}\n\terr := t.saveLocked()\n''', '''\tt.cfg.UserID = 0\n\tt.cfg.ChatID = 0\n\tt.cfg.BoundAt = time.Time{}\n\tt.cfg.FailureMessages = map[string]int64{}\n\tt.bindingUntil = time.Time{}\n\terr := t.saveLocked()\n''', 1)

          p.write_text(s)

          p = Path('main.go')
          s = p.read_text().replace('appVersion       = "v1.3.0"', 'appVersion       = "v1.3.1"')
          if 'appVersion       = "v1.3.1"' not in s:
              raise SystemExit('main.go version patch failed')
          p.write_text(s)

          Path('VERSION').write_text('1.3.1\n')

          p = Path('install.sh')
          s = p.read_text().replace('VERSION=1.3.0', 'VERSION=1.3.1')
          if 'VERSION=1.3.1' not in s:
              raise SystemExit('install.sh version patch failed')
          p.write_text(s)

          p = Path('xs5.sh')
          s = p.read_text().replace('echo "1.3.0"', 'echo "1.3.1"')
          if 'echo "1.3.1"' not in s:
              raise SystemExit('xs5.sh version patch failed')
          p.write_text(s)

          Path('RELEASE.md').write_text('''# Xs5 v1.3.1\n\n本版本优化 Telegram 重复故障通知：同一个出口连续出现“暂未找到可用出口”时，只保留最新一条，避免自动恢复期间反复刷屏。\n\n- 每个出口独立保存自己的最新故障通知，不会误删其他国家或其他出口的消息。\n- 新故障通知发送成功后，自动删除该出口上一条同类故障通知，因此聊天窗口最终只保留最新状态。\n- 出口恢复成功后，自动删除该出口保留的“暂未找到可用出口”通知，再按原有规则发送恢复/切换成功通知。\n- Telegram Message ID 持久化在现有 `/etc/xs5/telegram.json` 中，服务重启后仍可继续清理此前保留的故障消息。\n- 更换 Bot Token、重新绑定或解绑管理员时会清空旧消息 ID，避免跨机器人或跨聊天误删。\n- 不改变节点池、健康检查、自动恢复、自学习评分、动态冷却和 VPN Gate / Proxio 切换逻辑。\n- 从旧版本更新不会改变已有 S5 端口、用户名、密码、国家、来源选择和 Telegram 绑定配置。\n\n> Xs5 使用第三方公开 VPN / SOCKS5 节点。公开节点可能不稳定、不可信或被目标站封禁，请勿通过不受信任的公共出口传输敏感明文数据。\n''')
          PY
          gofmt -w telegram.go main.go
      - name: Format and test
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
      - name: Safety guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.3.1"
          grep -q 'appVersion       = "v1.3.1"' main.go
          grep -q 'FailureMessages map\[string\]int64' telegram.go
          grep -q 'replaceFailureMessage' telegram.go
          grep -q 'deleteMessage' telegram.go
          grep -q 'clearFailureMessage' telegram.go
          ! grep -q 'v1.3.1' README.md
          git diff -- README.md | grep -q '^$' || { echo 'README changed unexpectedly'; exit 1; }
      - name: Remove temporary workflow
        run: rm -f .github/workflows/prepare-v1.3.1.yml
      - name: Commit v1.3.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram.go main.go VERSION install.sh xs5.sh RELEASE.md .github/workflows/prepare-v1.3.1.yml
          git diff --cached --name-only
          git commit -m 'release: Xs5 v1.3.1 Telegram failure dedupe'
          git push
