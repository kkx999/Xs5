name: Prepare Xs5 v1.3.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v1.3.1.yml'
      - '.github/prepare_v1_3_1.py'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply v1.3.1 patch
        run: python3 .github/prepare_v1_3_1.py
      - name: Format and test
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w telegram.go main.go
          go test ./...
          go vet ./...
      - name: Safety guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.3.1"
          grep -q 'appVersion       = "v1.3.1"' main.go
          grep -q 'FailureMessages map\[string\]int64' telegram.go
          grep -q 'replaceFailureMessage' telegram.go
          grep -q 'deleteMessage' telegram.go
          grep -q 'clearFailureMessage' telegram.go
          ! grep -q 'v1.3.1' README.md
          test -z "$(git diff --name-only -- README.md)"
      - name: Remove temporary preparation files
        run: rm -f .github/workflows/prepare-v1.3.1.yml .github/prepare_v1_3_1.py
      - name: Commit v1.3.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram.go main.go VERSION install.sh xs5.sh RELEASE.md .github/workflows/prepare-v1.3.1.yml .github/prepare_v1_3_1.py
          git commit -m 'release: Xs5 v1.3.1 Telegram failure dedupe'
          git push
