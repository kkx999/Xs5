name: Prepare v1.3.4

on:
  push:
    branches:
      - release/v1.3.4-upload-speedtest
    paths:
      - '.prepare-v1.3.4.trigger'
      - '.github/workflows/prepare-v1.3.4.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply changes
        run: python3 .github/prepare-v1.3.4.py
      - name: Format and test
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go speedtest.go speedtest_test.go telegram.go
          git diff --check
          go test ./...
          go vet ./...
          grep -q '^1.3.4$' VERSION
          grep -q 'appVersion.*v1.3.4' main.go
          grep -q 'speedTestCooldown.*10 \* time.Second' speedtest.go
          grep -q '上传速度' web.go
          grep -q '上传：%.2f MB/s' telegram.go
          if grep -q '下载：%.1f Mbps' telegram.go; then
            echo 'Telegram still exposes Mbps' >&2
            exit 1
          fi
      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .prepare-v1.3.4.trigger .github/prepare-v1.3.4.py .github/workflows/prepare-v1.3.4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add upload speed test'
          git push
