name: Apply v1.0.1 scan continuation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v1.0.1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply source patch
        run: python3 .github/patch-v1.0.1.py
      - name: Format and test
        run: |
          gofmt -w main.go scan_state.go scan_state_test.go
          go test ./...
          go vet ./...
      - name: Commit v1.0.1
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-v1.0.1.yml .github/patch-v1.0.1.py
          git add -A
          git commit -m 'release: Xs5 v1.0.1 scan continuation and 5 minute cooldown'
          git push origin HEAD:main
