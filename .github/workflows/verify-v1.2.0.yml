name: Verify Xs5 v1.2.0 source feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v1.2.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test final source
        run: |
          go test ./...
          go vet ./...
      - name: Verify ProxyScrape metadata feed only
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://cdn.jsdelivr.net/gh/ProxyScrape/free-proxy-list@main/proxies/protocols/socks5/data.json' -o /tmp/proxyscrape.json
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/proxyscrape.json'))
          assert isinstance(rows,list) and rows, 'empty feed'
          required={'protocol','ip','port','country_code','uptime_percent','latency_ms'}
          good=[r for r in rows if isinstance(r,dict) and required.issubset(r) and str(r.get('protocol','')).lower()=='socks5']
          assert good, 'no compatible SOCKS5 metadata rows'
          print('feed rows:',len(rows),'compatible:',len(good))
          PY
      - name: Remove temporary verifier
        run: |
          rm -f .github/workflows/verify-v1.2.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove v1.2.0 source verifier'
          git push
