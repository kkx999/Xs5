name: Finalize Xs5 v1.0.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v1.0.2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply final v1.0.2 policy
        run: python3 scripts/apply_v1_0_2_probe_policy.py
      - name: Format and test
        run: |
          gofmt -w main.go health.go recovery.go scan_state.go probe_policy_test.go
          go test ./...
          go vet ./...
      - name: Commit v1.0.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.go health.go recovery.go scan_state.go probe_policy_test.go VERSION RELEASE.md install.sh
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'release: Xs5 v1.0.2 multi-probe validation and automatic recovery'
          git push origin HEAD:main
