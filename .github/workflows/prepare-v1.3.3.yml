      - name: Format and test
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go health.go telegram.go speedtest.go speedtest_test.go
          git diff --check
          go test ./...
          go vet ./...
          test "$(tr -d '[:space:]' < VERSION)" = "1.3.3"
          grep -q 'appVersion       = "v1.3.3"' main.go
          grep -q '^VERSION=1.3.3$' install.sh
          grep -q 'echo "1.3.3"' xs5.sh
          grep -q '/api/pool/speedtest' main.go
          grep -q '"command": "speed"' telegram.go
          git diff --exit-code -- README.md adaptive_quality.go candidate_quality.go recovery.go scan_state.go proxyscrape.go .github/workflows/release.yml

      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-v1.3.3.yml .prepare-v1.3.3.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add current exit speed test'
          git push
