name: Finalize Xs5 v1.1.0

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize_v1_1_0.py'
      - '.github/workflows/finalize-v1.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply final behavior polish
        run: python3 scripts/finalize_v1_1_0.py
      - name: Format and test
        run: |
          gofmt -w *.go
          go test ./...
          go vet ./...
      - name: Remove temporary finalizer
        run: |
          rm -f scripts/finalize_v1_1_0.py
          rm -f .github/workflows/finalize-v1.1.0.yml
          rmdir scripts 2>/dev/null || true
      - name: Commit final v1.1.0 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize Xs5 v1.1.0 Telegram behavior'
          git push
