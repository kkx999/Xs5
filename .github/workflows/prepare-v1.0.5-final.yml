name: Finalize Xs5 v1.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v1.0.5-final.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply final guard patch
        run: python3 .github/patch-v1.0.5-final.py
      - name: Format and test
        run: |
          gofmt -w main.go resource_guard.go
          go test ./...
          go vet ./...
      - name: Commit final v1.0.5
        run: |
          set -euo pipefail
          rm -f .github/patch-v1.0.5-final.py .github/workflows/prepare-v1.0.5-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve runtime during local resource pressure'
          git push origin HEAD:main
