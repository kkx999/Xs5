name: Prepare v1.3.2

on:
  push:
    branches:
      - 'release/v1.3.2-ip-attributes'
    paths:
      - '.prepare-v1.3.2.trigger'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply changes
        run: python3 .github/prepare-v1.3.2.py
      - name: Format and test
        run: |
          set -euo pipefail
          gofmt -w telegram.go telegram_test.go main.go
          git diff --check
          go test ./...
          go vet ./...
          test "$(tr -d '[:space:]' < VERSION)" = "1.3.2"
          grep -q 'appVersion       = "v1.3.2"' main.go
          grep -q '^VERSION=1.3.2$' install.sh
          grep -q 'echo "1.3.2"' xs5.sh
          git diff --exit-code -- README.md
      - name: Commit prepared release
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-v1.3.2.yml .github/prepare-v1.3.2.py .prepare-v1.3.2.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: show IP attributes in Telegram notifications'
          git push
