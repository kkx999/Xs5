name: Rebuild final Xs5 v1.0.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1.0.2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Fix panel version display and clean temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('web.go')
          s = p.read_text()
          old = '<h1>X S5 池 <span class="version">v1.0.0</span></h1>'
          new = '<h1>X S5 池 <span class="version" id="appVersion">-</span></h1>'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('panel version span anchor not found')

          old = "async function loadStatus(){try{var s=await j('/api/status');if(s.server_ip)serverIP=s.server_ip;document.getElementById('statNodes').textContent=s.nodes==null?'-':s.nodes}catch(e){}}"
          new = "async function loadStatus(){try{var s=await j('/api/status');if(s.server_ip)serverIP=s.server_ip;var ve=document.getElementById('appVersion');if(ve&&s.version)ve.textContent=s.version;document.getElementById('statNodes').textContent=s.nodes==null?'-':s.nodes}catch(e){}}"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('loadStatus anchor not found')
          p.write_text(s)

          x = Path('xs5.sh')
          t = x.read_text()
          t = t.replace('version(){ cat "$VERSION_FILE" 2>/dev/null || echo "1.0.1"; }', 'version(){ cat "$VERSION_FILE" 2>/dev/null || echo "1.0.2"; }')
          x.write_text(t)
          PY
          rm -f .github/workflows/patch-v1.0.2.yml \
                scripts/apply_v1_0_2_final.py \
                scripts/apply_v1_0_2_probe_policy.py \
                .github/workflows/finalize-v1.0.2.yml
      - name: Format and test
        run: |
          gofmt -w web.go main.go health.go recovery.go scan_state.go
          go test ./...
          go vet ./...
      - name: Commit final v1.0.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: show runtime version in panel and finalize v1.0.2'
          git push origin HEAD:main
      - name: Rebuild packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          rm -rf dist
          mkdir -p dist
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -ldflags '-s -w' -o xs5d .
            PKG="xs5-v${VERSION}-linux-${ARCH}"
            mkdir -p "dist/$PKG"
            cp xs5d install.sh uninstall.sh xs5.sh xs5.service README.md LICENSE "dist/$PKG/"
            (cd "dist/$PKG" && tar -czf "../${PKG}.tar.gz" .)
            rm -rf "dist/$PKG" xs5d
          done
          (cd dist && sha256sum xs5-v${VERSION}-linux-*.tar.gz > SHA256SUMS)
      - name: Move v1.0.2 tag and replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f v1.0.2 HEAD
          git push --force origin refs/tags/v1.0.2
          gh release upload v1.0.2 \
            dist/xs5-v1.0.2-linux-amd64.tar.gz \
            dist/xs5-v1.0.2-linux-arm64.tar.gz \
            dist/SHA256SUMS \
            --clobber
          gh release edit v1.0.2 --title 'Xs5 v1.0.2' --notes-file RELEASE.md
