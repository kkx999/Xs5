name: Prepare Xs5 v1.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v1.0.5.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply v1.0.5 patch
        run: python3 .github/patch-v1.0.5.py
      - name: Format and test
        run: |
          gofmt -w main.go health.go recovery.go resource_guard.go resource_guard_test.go
          go test ./...
          go vet ./...
      - name: Commit v1.0.5
        run: |
          set -euo pipefail
          rm -f .github/patch-v1.0.5.py .github/workflows/prepare-v1.0.5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Xs5 v1.0.5 resource stability'
          git push origin HEAD:main
