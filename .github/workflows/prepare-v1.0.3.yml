name: Prepare Xs5 v1.0.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v1.0.3.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply v1.0.3 fix
        run: python3 .github/scripts/prepare_v1_0_3.py
      - name: Format and test
        run: |
          gofmt -w health.go health_test.go main.go
          go test ./...
          go vet ./...
      - name: Commit v1.0.3
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-v1.0.3.yml .github/scripts/prepare_v1_0_3.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Xs5 v1.0.3 dynamic exit health stability'
          git push origin HEAD:main
