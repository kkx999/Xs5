name: Prepare v1.3.5

on:
  push:
    branches: [release/v1.3.5-speedtest-timeout-fix]
    paths: ['.prepare-v1.3.5.trigger']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Update metadata and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes = {
              'main.go': ('appVersion       = "v1.3.4"', 'appVersion       = "v1.3.5"'),
              'install.sh': ('VERSION=1.3.4', 'VERSION=1.3.5'),
              'xs5.sh': ('version(){ cat "$VERSION_FILE" 2>/dev/null || echo "1.3.4"; }', 'version(){ cat "$VERSION_FILE" 2>/dev/null || echo "1.3.5"; }'),
          }
          for path, (old, new) in changes.items():
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: version marker mismatch')
              p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w main.go speedtest.go speedtest_test.go
          git diff --check
          go test ./...
          go vet ./...
          grep -q '^1.3.5$' VERSION
          grep -q 'appVersion.*v1.3.5' main.go
          grep -q 'context.WithTimeout(context.Background(), speedTestMaxDuration)' speedtest.go
          grep -q 'errors.Is(ctx.Err(), context.DeadlineExceeded)' speedtest.go
          ! grep -q 'elapsed >= speedTestMaxDuration-300' speedtest.go
          ! grep -q 'time.AfterFunc(speedTestMaxDuration' speedtest.go
      - name: Commit validated changes
        run: |
          rm -f .prepare-v1.3.5.trigger .github/workflows/prepare-v1.3.5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finalize v1.3.5 speed-test timeout handling'
          git push
