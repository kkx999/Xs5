name: Rebuild Clean v1.0.0 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-v1.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc1b19faec4f85405d17d8e692e0247b95d4af4d
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -ldflags '-s -w' -o xs5d .
            PKG="xs5-v${VERSION}-linux-${ARCH}"
            mkdir -p "dist/$PKG"
            cp xs5d install.sh uninstall.sh xs5.sh xs5.service README.md LICENSE "dist/$PKG/"
            (cd "dist/$PKG" && tar -czf "../${PKG}.tar.gz" .)
            rm -rf "dist/$PKG" xs5d
          done
          (cd dist && sha256sum xs5-v${VERSION}-linux-*.tar.gz > SHA256SUMS)
      - name: Recreate clean release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v1.0.0
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            dist/xs5-v1.0.0-linux-amd64.tar.gz \
            dist/xs5-v1.0.0-linux-arm64.tar.gz \
            dist/SHA256SUMS \
            --target cc1b19faec4f85405d17d8e692e0247b95d4af4d \
            --title "Xs5 v1.0.0" \
            --notes-file RELEASE.md
